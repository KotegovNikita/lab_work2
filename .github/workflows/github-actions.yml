name: Build and Test

on:
  push:
    branches: [ main, realisation ]
  pull_request:
    branches: [ main, realisation ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt update && sudo apt install -y cmake g++ doxygen libgtest-dev && \
           cd /usr/src/gtest && sudo cmake . && sudo make && sudo cp lib/*.a /usr/lib

    - name: Configure CMake
      run: cmake -S . -B build

    - name: Build project
      run: cmake --build build

    - name: Run tests
      run: cd build && ctest --output-on-failure

    - name: Generate Doxygen docs
      run: |
        doxygen Doxyfile || echo "No Doxyfile found or error generating docs"
